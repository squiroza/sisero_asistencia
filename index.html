<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SISERO</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800&family=Barlow:wght@500;600&display=swap">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f3f6;font-family:Barlow,system-ui,sans-serif;color:#141a22}
.box{width:min(380px,calc(100vw - 32px));display:flex;flex-direction:column;gap:14px;text-align:center}
img{width:170px;align-self:center;margin-bottom:10px}
a{display:block;height:60px;line-height:60px;border-radius:12px;text-decoration:none;font:italic 800 21px "Exo 2",sans-serif;text-transform:uppercase}
.a1{background:#0b2c55;color:#fff}.a2{background:#fff;color:#0b2c55;border:1px solid #c8d0da}
</style>
</head>
<body>
<div class="box">
  <img src="assets/sisero-logo.png" alt="SISERO">
  <a class="a1" href="checador/">Checador</a>
  <a class="a2" href="admin/">Administrador</a>
</div>
</body>
</html>
