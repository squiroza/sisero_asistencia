<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora de actividades</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a1a33'/%3E%3Ctext x='32' y='41' font-family='Arial,sans-serif' font-size='24' font-weight='700' fill='%23fff' text-anchor='middle'%3EIST%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0a1a33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: una columna tipo celular; login, lista de actividades agrupada por día y formulario con barra de acciones fija abajo */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --ink:#0c2247; --muted:#5a6473; --line:#d3dbe6;
  --accent:#2f62a3; --accent-ink:#ffffff; --ok:#1f7a4d; --bad:#b3261e; --warn:#9a5700;
  --head:#0a1a33; --head-ink:#ffffff; --head-sub:#9fb4d4;
  --display:"Poppins","Segoe UI",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071226; --surface:#0f2040; --ink:#e9eff8; --muted:#a0b0c8; --line:#263d63;
    --accent:#6a9bd8; --accent-ink:#06101f; --ok:#4fbf86; --bad:#f0736a; --warn:#e3a34f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071226; --surface:#0f2040; --ink:#e9eff8; --muted:#a0b0c8; --line:#263d63;
  --accent:#6a9bd8; --accent-ink:#06101f; --ok:#4fbf86; --bad:#f0736a; --warn:#e3a34f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 130px}
header.top{background:var(--head);color:var(--head-ink);padding:10px 16px;position:sticky;top:0;z-index:5}
header.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{margin-right:auto;display:grid;gap:1px;line-height:1}
.brand b{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.05em}
.brand{gap:3px}.brand small{font-family:var(--display);font-size:10px;letter-spacing:.2em;font-weight:600;color:var(--head-sub)}
.logoCard{background:var(--head);color:var(--head-ink);border-radius:12px;padding:26px 18px;margin-top:22px;text-align:center;display:grid;gap:6px}
.logoCard b{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:.04em;text-wrap:balance}
.logoCard span{font-family:var(--display);font-size:11px;letter-spacing:.22em;color:var(--head-sub)}
.spin{display:block;width:34px;height:34px;margin:0 auto 10px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.who{font-size:13px;text-align:right;line-height:1.2;max-width:150px}
h2{font-family:var(--display);font-size:20px;font-weight:600;margin:24px 0 8px;text-wrap:balance}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;border-color:transparent;color:inherit;padding:8px 10px}
button.danger{color:var(--bad)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.opt:focus-within,label.add:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:5px;font-size:14px;font-weight:600;min-width:0}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=search],select,textarea{font:inherit;width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:130px;resize:vertical}
input:disabled,textarea:disabled,select:disabled{opacity:1;color:var(--ink)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.nav b{font-family:var(--display);font-size:18px;text-align:center}
.nav button{padding:8px 16px;font-size:20px;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.tile span{display:block;font-size:13px;color:var(--muted)}
.tile b{font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile.pen b{color:var(--warn)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{padding:8px 4px;background:var(--bg)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.opt{position:relative;border:1px solid var(--line);border-radius:8px;padding:10px 4px;text-align:center;font-weight:600;background:var(--bg);cursor:pointer}
label.opt input{position:absolute;opacity:0;inset:0}
label.opt.on.fin{background:var(--ok);border-color:var(--ok);color:#fff}
label.opt.on.pen{background:var(--warn);border-color:var(--warn);color:#fff}
.dia{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dia b{font-family:var(--display);font-size:16px}
.dia span{font-size:13px;color:var(--muted);white-space:nowrap}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-weight:400}
.card.pen{border-left-color:var(--warn)}
.card b{display:block;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.card .desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;overflow-wrap:anywhere}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-end;margin-top:8px}
.card .row span:first-child{color:var(--muted);font-size:14px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid currentColor;color:var(--ok);white-space:nowrap}
.pill.pen{color:var(--warn)}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:14px;color:var(--muted)}
.meta b{display:block;color:var(--ink);font-size:16px;overflow-wrap:anywhere}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fotos figure{margin:0;position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos figure a{display:block;height:100%}
.fotos figure button{position:absolute;top:4px;right:4px;padding:2px 9px;border-radius:99px;background:#000b;color:#fff;border:0}
label.add{display:block;text-align:center;border:1px dashed var(--accent);color:var(--accent);border-radius:8px;padding:12px 6px;font-weight:600;cursor:pointer;position:relative}
label.add input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--bad);font-weight:600;margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .in button{flex:1}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(440px,calc(100% - 32px));padding:18px}
dialog::backdrop{background:#0008}
dialog h3{font-family:var(--display);font-size:19px;margin:0 0 8px}
dialog p{margin:0 0 16px;white-space:pre-line}
dialog .act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#dlgF{display:grid;gap:12px;margin-bottom:16px}
#dlgF textarea{min-height:220px;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><b>INTERNACIONAL SECURE TEK</b><small>BITÁCORA</small></div>
  <div class="who" id="who" hidden></div>
  <button class="ghost" id="btnBack" hidden>← Bitácora</button>
  <button class="ghost" id="btnSalir" hidden>Salir</button>
</div></header>

<main class="wrap">
  <section id="vLogin" hidden>
    <div class="logoCard"><b>INTERNACIONAL SECURE TEK</b><span>BITÁCORA DE ACTIVIDADES</span></div>
    <h2>Iniciar sesión</h2>
    <form class="sec" id="fLogin">
      <label class="f" for="lUsuario">Usuario<input type="text" id="lUsuario" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="f" for="lPass">Contraseña<input type="password" id="lPass" autocomplete="current-password"></label>
      <p class="err" id="lMsg" hidden></p>
      <button class="pri" id="lBtn" type="submit">Entrar</button>
      <p class="hint">Bitácora personal: solo entra el administrador general, con su usuario y contraseña de Supervisiones.</p>
    </form>
  </section>

  <section id="vLista" hidden>
    <button class="pri" id="btnNueva" style="width:100%;margin-top:16px;padding:14px">+ Registrar actividad</button>
    <button id="btnRep" style="width:100%;margin-top:10px">Crear reporte (PDF o texto para WhatsApp)</button>
    <div class="nav"><button id="mAnt" aria-label="Mes anterior">‹</button><b id="mesTxt"></b><button id="mSig" aria-label="Mes siguiente">›</button></div>
    <div class="tiles">
      <div class="tile"><span>Actividades</span><b id="tAct">0</b></div>
      <div class="tile"><span>Sitios atendidos</span><b id="tSit">0</b></div>
      <div class="tile pen"><span>Pendientes</span><b id="tPen">0</b></div>
    </div>
    <div class="sec" style="margin-top:12px">
      <input type="search" id="fQ" placeholder="Buscar: cámara, Rocío, tag, usuario…" aria-label="Buscar en la bitácora">
      <div class="two">
        <select id="fSitio" aria-label="Filtrar por sitio"></select>
        <select id="fCat" aria-label="Filtrar por categoría"></select>
      </div>
      <select id="fUsr" aria-label="Filtrar por persona" hidden></select>
      <div class="seg" id="fEst">
        <button data-e="" class="on">Todas</button><button data-e="Realizado">Realizadas</button><button data-e="Pendiente">Pendientes</button>
      </div>
    </div>
    <div id="lista"></div>
  </section>

  <section id="vForm" hidden></section>
</main>

<div class="bar" id="bar" hidden><div class="in">
  <button id="btnCancelar">Cancelar</button>
  <button class="pri" id="btnGuardar">Guardar actividad</button>
</div></div>

<datalist id="dlSitios"></datalist><datalist id="dlSol"></datalist>

<dialog id="dlg"><h3 id="dlgT"></h3><p id="dlgB"></p><form id="dlgF"></form>
  <div class="act"><button id="dlgNo">Cancelar</button><button class="pri" id="dlgOk">Aceptar</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* ====== CONFIGURACIÓN: mismo proyecto de Supabase que Supervisiones ====== */
const EMPRESA = "INTERNACIONAL SECURE TEK";
const CFG = {
  url: "https://noolfrypryyfrnkqdhzo.supabase.co",   // Project URL
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vb2xmcnlwcnl5ZnJua3FkaHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzNTg1OTEsImV4cCI6MjEwOTkzNDU5MX0.K-VeXTw8CuRslFiVuLbs2V52zoaEhK_yw4Lyyh2jCjg",   // clave anon (pública)
  dominio: "sisero.com.mx",
  bucket: "bitacora"
};

/* ====== Categorías fijas. Las nuevas se agregan desde la app (al registrar una actividad) ====== */
const CATEGORIAS = [
  "Cámaras / CCTV",
  "DVR / NVR",
  "Hik-Connect (usuarios)",
  "Biométrico / Control de acceso",
  "Tags vehiculares",
  "Red / Internet",
  "Interfón / Comunicaciones",
  "Mantenimiento",
  "Operación / Supervisión",
  "Administrativo",
  "Otro"
];
const MAX_FOTOS = 6;
let EXTRA = [];                                   // categorías que tú agregas (se guardan en Supabase)
const cats = () => [...CATEGORIAS, ...EXTRA.filter(c => !CATEGORIAS.includes(c))];

/* ====== Estado ====== */
let sb = null, uid = null, perfil = null;
let mes = new Date(), rows = [], cur = null, esNueva = false, sucio = false;
let subidas = [], quitadas = [];          // fotos subidas o quitadas mientras se edita (se limpian al guardar o cancelar)
const fil = { q: "", sitio: "", cat: "", est: "", usr: "" };
const SUG = { sitios: new Set(), sol: new Set() };
const URLS = {};

/* ====== Utilidades ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const p2 = n => String(n).padStart(2, "0");
const hora = d => p2(d.getHours()) + ":" + p2(d.getMinutes());
const fecha = d => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
const deFecha = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const fechaLarga = s => { const d = deFecha(s); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fechaCorta = s => { const [y, m, d] = s.split("-"); return `${d}/${m}/${y}`; };
const plural = n => n === 1 ? "1 actividad" : n + " actividades";
const ver = v => ["vLogin", "vLista", "vForm"].forEach(id => $(id).hidden = id !== v);
const sinAcentos = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function ask(titulo, cuerpo, ok, cancelar, html) {
  return new Promise(res => {
    $("dlgT").textContent = titulo; $("dlgB").textContent = cuerpo; $("dlgB").hidden = !cuerpo;
    $("dlgF").innerHTML = html || ""; $("dlgF").hidden = !html; $("dlgF").onsubmit = e => { e.preventDefault(); $("dlgOk").click(); };
    $("dlgOk").textContent = ok || "Aceptar"; $("dlgNo").textContent = cancelar || "Cancelar";
    $("dlgNo").hidden = cancelar === null; $("dlgOk").disabled = false;
    const d = $("dlg"); const fin = v => { d.close(); res(v); };
    $("dlgOk").onclick = () => fin(true); $("dlgNo").onclick = () => fin(false); d.oncancel = () => res(false);
    d.showModal();
  });
}
const aviso = (t, m) => ask(t, m, "Entendido", null);

/* ====== Inicio de sesión (mismos usuarios que Supervisiones) ====== */
function verLogin(msg) {
  uid = null; perfil = null; cur = null;
  ver("vLogin"); $("bar").hidden = true;
  ["who", "btnBack", "btnSalir"].forEach(id => $(id).hidden = true);
  $("lMsg").textContent = msg || ""; $("lMsg").hidden = !msg; $("lPass").value = "";
}
async function iniciar() {
  if (!window.supabase) { verLogin("No se pudo cargar la conexión. Revisa tu internet y vuelve a abrir la página."); $("lBtn").disabled = true; return; }
  sb = window.supabase.createClient(CFG.url, CFG.key);
  const { data } = await sb.auth.getSession();
  if (data && data.session) entrar(data.session.user); else verLogin();
}
$("fLogin").onsubmit = async e => {
  e.preventDefault();
  const u = $("lUsuario").value.trim().toLowerCase(), p = $("lPass").value;
  if (!u || !p) { $("lMsg").textContent = "Escribe tu usuario y tu contraseña."; $("lMsg").hidden = false; return; }
  $("lBtn").disabled = true; $("lBtn").textContent = "Entrando…";
  const { data, error } = await sb.auth.signInWithPassword({ email: u.includes("@") ? u : u + "@" + CFG.dominio, password: p });
  $("lBtn").disabled = false; $("lBtn").textContent = "Entrar";
  if (error) return verLogin(/invalid/i.test(error.message) ? "Usuario o contraseña incorrectos." : "No se pudo iniciar sesión. Revisa tu internet e intenta de nuevo.");
  entrar(data.user);
};
async function entrar(user) {
  uid = user.id;
  const { data, error } = await sb.from("sup_supervisores").select("nombre,usuario,rol,activo").eq("id", uid).maybeSingle();
  if (error) return verLogin("No se pudo consultar tu usuario. Revisa tu internet e intenta de nuevo.");
  if (!data || !data.activo) { await sb.auth.signOut(); return verLogin("Tu usuario no está dado de alta o está inactivo. Avisa al administrador."); }
  if (data.rol !== "admin") { await sb.auth.signOut(); return verLogin("Esta bitácora es personal: solo entra el administrador general."); }
  perfil = data;
  $("who").textContent = perfil.nombre; $("who").hidden = false;
  cargarSugerencias();
  verLista();
}
$("btnSalir").onclick = async () => {
  if (await ask("Cerrar sesión", "¿Salir de la bitácora en este dispositivo?", "Salir")) { await sb.auth.signOut(); verLogin(); }
};

/* Sugerencias al escribir: servicios del catálogo de Supervisiones + lo que ya has capturado antes */
async function cargarSugerencias() {
  const [a, b, c] = await Promise.all([
    sb.from("sup_servicios").select("nombre").order("nombre"),
    sb.from("bit_categorias").select("nombre").order("nombre"),
    sb.from("bit_actividades").select("sitio,solicito").order("actualizado", { ascending: false }).limit(400)
  ].map(q => q.then(r => r, () => ({ data: [] }))));
  [a.data, b.data, c.data] = [a.data, c.data, b.data];   // a: servicios, b: actividades, c: categorías
  EXTRA = (c.data || []).map(x => x.nombre); if (!$("vLista").hidden && rows.length) pintarFiltros();
  (a.data || []).forEach(s => s.nombre && SUG.sitios.add(s.nombre));
  (b.data || []).forEach(r => { if (r.sitio) SUG.sitios.add(r.sitio); if (r.solicito) SUG.sol.add(r.solicito); });
  pintarSugerencias();
}
function pintarSugerencias() {
  $("dlSitios").innerHTML = [...SUG.sitios].sort((x, y) => x.localeCompare(y, "es")).map(s => `<option value="${esc(s)}">`).join("");
  $("dlSol").innerHTML = [...SUG.sol].sort((x, y) => x.localeCompare(y, "es")).map(s => `<option value="${esc(s)}">`).join("");
}

/* ====== Lista del mes ====== */
function rangoMes(d) {
  const y = d.getFullYear(), m = d.getMonth();
  return [`${y}-${p2(m + 1)}-01`, `${y}-${p2(m + 1)}-${p2(new Date(y, m + 1, 0).getDate())}`];
}
async function verLista() {
  cur = null; ver("vLista"); $("bar").hidden = true; $("btnBack").hidden = true; $("btnSalir").hidden = false;
  $("mesTxt").textContent = MESES[mes.getMonth()][0].toUpperCase() + MESES[mes.getMonth()].slice(1) + " " + mes.getFullYear();
  $("lista").innerHTML = `<p class="empty"><span class="spin"></span>Cargando…</p>`;
  const [d1, d2] = rangoMes(mes);
  const { data, error } = await sb.from("bit_actividades").select("*").gte("fecha", d1).lte("fecha", d2)
    .order("fecha", { ascending: false }).order("hora", { ascending: false }).limit(1000);
  if (error) {
    rows = []; pintarTiles([]);
    $("lista").innerHTML = `<p class="empty">${/bit_actividades|schema cache|does not exist/i.test(error.message)
      ? "Falta preparar la base de datos: corre una vez el archivo bitacora.sql en el SQL Editor de Supabase y vuelve a abrir la app."
      : "No se pudo cargar la bitácora. Revisa tu internet y vuelve a intentar."}</p>`;
    return;
  }
  rows = data || [];
  pintarFiltros(); pintar();
}
function pintarFiltros() {
  const sitios = [...new Set(rows.map(r => r.sitio).filter(Boolean))].sort((x, y) => x.localeCompare(y, "es"));
  if (fil.sitio && !sitios.includes(fil.sitio)) fil.sitio = "";
  $("fSitio").innerHTML = `<option value="">Todos los sitios</option>` + sitios.map(s => `<option ${s === fil.sitio ? "selected" : ""}>${esc(s)}</option>`).join("");
  const cs = [...new Set([...cats(), ...rows.map(r => r.categoria).filter(Boolean)])];
  $("fCat").innerHTML = `<option value="">Todas las categorías</option>` + cs.map(c => `<option ${c === fil.cat ? "selected" : ""}>${esc(c)}</option>`).join("");
  const us = new Map(rows.map(r => [r.usuario_id, r.usuario]));
  if (fil.usr && !us.has(fil.usr)) fil.usr = "";
  $("fUsr").hidden = us.size < 2;

/* ---- Fotos de evidencia: se comprimen antes de subir para gastar pocos datos y poco espacio ---- */
async function cargarUrls(rutas) {
  const faltan = rutas.filter(r => !URLS[r]); if (!faltan.length) return;
  const { data } = await sb.storage.from(CFG.bucket).createSignedUrls(faltan, 3600);
  (data || []).forEach((d, i) => { if (d && d.signedUrl) URLS[faltan[i]] = d.signedUrl; });
}
async function pintarFotos() {
  const o = cur, ro = $("bar").hidden;
  await cargarUrls(o.evidencias); if (cur !== o) return;
  $("fotos").innerHTML = o.evidencias.map((r, i) => `<figure>${URLS[r] ? `<a href="${esc(URLS[r])}" target="_blank" rel="noopener"><img src="${esc(URLS[r])}" alt="Evidencia ${i + 1}"></a>` : ""}${ro ? "" : `<button type="button" data-rm="${i}" aria-label="Quitar evidencia ${i + 1}">✕</button>`}</figure>`).join("")
    || (ro ? `<p class="hint">Sin fotos de evidencia.</p>` : "");
  if (ro) return;
  $("fotos").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    const [r] = o.evidencias.splice(+b.dataset.rm, 1); sucio = true;
    if (subidas.includes(r)) { subidas = subidas.filter(x => x !== r); sb.storage.from(CFG.bucket).remove([r]); } else quitadas.push(r);
    pintarFotos();
  });
  $("addFotos").hidden = o.evidencias.length >= MAX_FOTOS;
  $("fotoTxt").textContent = `${o.evidencias.length} de ${MAX_FOTOS} fotos. Sirven fotos de la cámara y capturas de pantalla (por ejemplo de Hik-Connect).`;
}
function comprimir(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(), "image/jpeg", .65);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); }; im.src = url;
  });
}
async function agregarFotos(e) {
  const o = cur, files = [...e.target.files], quedan = MAX_FOTOS - o.evidencias.length; let fallas = 0;
  e.target.value = ""; if (!files.length) return;
  $("fotoTxt").textContent = "Subiendo fotos…";
  for (const [i, f] of files.slice(0, quedan).entries()) {
    try {
      const b = await comprimir(f), ruta = uid + "/" + o.id + "/ev-" + Date.now() + "-" + i + ".jpg";
      const { error } = await sb.storage.from(CFG.bucket).upload(ruta, b, { contentType: "image/jpeg" });
      if (error) throw error;
      URLS[ruta] = URL.createObjectURL(b); o.evidencias.push(ruta); subidas.push(ruta); sucio = true;
    } catch (err) { fallas++; }
  }
  if (cur === o) pintarFotos();
  if (fallas) aviso("Fotos sin subir", `No se pudieron subir ${fallas === 1 ? "1 foto" : fallas + " fotos"}. Revisa tu internet y agrégalas de nuevo.`);
  else if (files.length > quedan) aviso("Límite de fotos", `Se permiten ${MAX_FOTOS} fotos por actividad. Se agregaron las primeras ${quedan}.`);
}

const periodo = (d1, d2) => d1 === d2 ? fechaCorta(d1) : `${fechaCorta(d1)} al ${fechaCorta(d2)}`;

function cargarJsPDF() {
  return window.jspdf ? Promise.resolve() : new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
const aDataUrl = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
const medir = src => new Promise(res => { const im = new Image(); im.onload = () => res([im.naturalWidth, im.naturalHeight]); im.onerror = () => res([4, 3]); im.src = src; });

async function reportePDF(L, d1, d2, conFotos, btn) {
  await cargarJsPDF();
  const FOT = {};
  if (conFotos) {
    const total = L.reduce((n, r) => n + (r.evidencias || []).length, 0); let k = 0;
    for (const r of L) { FOT[r.id] = [];
      for (const ruta of r.evidencias || []) {
        btn.textContent = `Descargando fotos (${++k} de ${total})…`;
        const { data, error } = await sb.storage.from(CFG.bucket).download(ruta);
        if (!error && data) { const u = await aDataUrl(data); FOT[r.id].push({ u, d: await medir(u) }); }
      }
    }
  }
  btn.textContent = "Creando PDF…";
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter" });
  const W = 215.9, H = 279.4, M = 14, CW = W - 2 * M, NAVY = [10, 26, 51], AZUL = [47, 98, 163], GRIS = [95, 104, 118], LINEA = [211, 219, 230], OK = [31, 122, 77], PEN = [154, 87, 0];
  let y = 0;
  const fuente = (t, estilo, c) => { doc.setFont("helvetica", estilo || "normal"); doc.setFontSize(t); c = c || NAVY; doc.setTextColor(c[0], c[1], c[2]); };
  const salto = h => { if (y + h > H - 18) { doc.addPage(); y = 16; return true; } return false; };

  // Encabezado
  doc.setFillColor(...NAVY); doc.rect(0, 0, W, 30, "F");
  fuente(15, "bold", [255, 255, 255]); doc.text(EMPRESA, M, 17);
  fuente(8.5, "normal", [159, 180, 212]); doc.text("Seguridad privada", M, 22.5);
  fuente(13, "bold", [255, 255, 255]); doc.text("BITÁCORA DE ACTIVIDADES", W - M, 14, { align: "right" });
  fuente(8.5, "normal", [159, 180, 212]); doc.text(d1 === d2 ? "Reporte del " + fechaCorta(d1) : "Reporte del " + periodo(d1, d2), W - M, 20, { align: "right" });
  y = 40;

  // Resumen
  const pend = L.filter(r => r.estatus === "Pendiente").length, sitios = new Set(L.map(r => r.sitio)).size, varios = new Set(L.map(r => r.usuario_id)).size > 1;
  fuente(7.5, "bold", GRIS); doc.text("ELABORÓ", M, y); doc.text("PERIODO", M + CW / 2, y);
  fuente(10.5, "bold"); doc.text(doc.splitTextToSize(autores(L), CW / 2 - 6)[0], M, y + 4.8); doc.text(periodo(d1, d2), M + CW / 2, y + 4.8);
  y += 10;
  doc.setFillColor(238, 243, 250); doc.roundedRect(M, y, CW, 15, 2, 2, "F");
  [[L.length, L.length === 1 ? "actividad" : "actividades", NAVY], [sitios, sitios === 1 ? "sitio atendido" : "sitios atendidos", NAVY], [pend, pend === 1 ? "pendiente" : "pendientes", pend ? PEN : OK]].forEach(([n, l, c], i) => {
    const x = M + 6 + i * (CW / 3);
    fuente(17, "bold", c); doc.text(String(n), x, y + 10.2);
    fuente(9, "normal", GRIS); doc.text(l, x + doc.getTextWidth(String(n)) * 1.95 + 2.5, y + 10.2);
  });
  y += 22;

  const cw = (CW - 8) / 3, ch = 44;
  porDia(L).forEach(([f, rs]) => {
    salto(30);
    doc.setFillColor(...NAVY); doc.rect(M, y, CW, 7, "F");
    fuente(9, "bold", [255, 255, 255]); doc.text(fechaLarga(f).toUpperCase() + " DE " + f.slice(0, 4), M + 3, y + 4.8);
    doc.text(plural(rs.length), W - M - 3, y + 4.8, { align: "right" });
    y += 12;
    rs.forEach(r => {
      fuente(9.5); const ls = doc.splitTextToSize(r.descripcion || "", CW - 22);
      const meta = [r.categoria, r.solicito ? "Solicitó: " + r.solicito : "", varios ? "Registró: " + r.usuario : ""].filter(Boolean).join("   ·   ");
      const fotos = FOT[r.id] || [];
      salto(11 + ls.length * 4.4 + (fotos.length ? ch + 6 : 0) > H - 40 ? 30 : 11 + ls.length * 4.4 + (fotos.length ? ch + 6 : 0));
      const pen = r.estatus === "Pendiente";
      fuente(10, "bold", AZUL); doc.text(r.hora || "—", M, y);
      fuente(10.5, "bold"); doc.text(doc.splitTextToSize(r.sitio, CW - 50)[0], M + 16, y);
      fuente(8.5, "bold", pen ? PEN : OK); doc.text(pen ? "PENDIENTE" : "REALIZADO", W - M, y, { align: "right" });
      y += 4.6; fuente(8.5, "normal", GRIS); doc.text(doc.splitTextToSize(meta, CW - 18)[0], M + 16, y);
      y += 5; fuente(9.5);
      ls.forEach(l => { if (salto(5)) fuente(9.5); doc.text(l, M + 16, y); y += 4.4; });
      if (fotos.length) {
        y += 1.5;
        fotos.forEach((p, i) => {
          if (i % 3 === 0) salto(ch + 4);
          const x = M + (i % 3) * (cw + 4), k = Math.min(cw / p.d[0], ch / p.d[1]), w = p.d[0] * k, h = p.d[1] * k;
          doc.setFillColor(245, 247, 251); doc.rect(x, y, cw, ch, "F");
          doc.addImage(p.u, "JPEG", x + (cw - w) / 2, y + (ch - h) / 2, w, h);
          if (i % 3 === 2 || i === fotos.length - 1) y += ch + 4;
        });
      }
      y += 1; doc.setDrawColor(...LINEA); doc.line(M, y, W - M, y); y += 6;
    });
    y += 2;
  });

  // Pie de página
  const n = doc.getNumberOfPages(), hoy = new Date();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setDrawColor(...LINEA); doc.line(M, H - 12, W - M, H - 12); fuente(7.5, "normal", GRIS);
    doc.text(`${EMPRESA} · Bitácora de actividades · Generado el ${p2(hoy.getDate())}/${p2(hoy.getMonth() + 1)}/${hoy.getFullYear()} ${hora(hoy)}`, M, H - 7.5);
    doc.text(`Página ${i} de ${n}`, W - M, H - 7.5, { align: "right" });
  }
  doc.save(`Bitacora_${d1}${d1 === d2 ? "" : "_a_" + d2}.pdf`);
}

iniciar();
</script>
