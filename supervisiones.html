<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SISERO Supervisiones</title>
<link rel="icon" type="image/png" data-icono>
<link rel="apple-touch-icon" data-icono>
<meta name="theme-color" content="#0a1a33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: una columna tipo celular; login, bandeja de tarjetas y formulario por secciones con barra de acciones fija abajo */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --ink:#0c2247; --muted:#5a6473; --line:#d3dbe6;
  --accent:#2f62a3; --accent-ink:#ffffff; --ok:#1f7a4d; --bad:#b3261e; --na:#5e6167;
  --head:#0a1a33; --head-ink:#ffffff; --head-sub:#9fb4d4;
  --display:"Poppins","Segoe UI",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071226; --surface:#0f2040; --ink:#e9eff8; --muted:#a0b0c8; --line:#263d63;
    --accent:#6a9bd8; --accent-ink:#06101f; --ok:#4fbf86; --bad:#f0736a; --na:#9aa0a8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071226; --surface:#0f2040; --ink:#e9eff8; --muted:#a0b0c8; --line:#263d63;
  --accent:#6a9bd8; --accent-ink:#06101f; --ok:#4fbf86; --bad:#f0736a; --na:#9aa0a8; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 130px}
header.top{background:var(--head);color:var(--head-ink);padding:10px 16px;position:sticky;top:0;z-index:5}
header.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{margin-right:auto;display:grid;gap:1px;line-height:1}
.brand img{height:36px;width:auto;display:block;margin-left:-4px}
.brand small{font-family:var(--display);font-size:10px;letter-spacing:.2em;font-weight:600;color:var(--head-sub);padding-left:2px}
.logoCard{background:#fff;border-radius:12px;padding:22px 18px 18px;margin-top:22px;border:1px solid var(--line);text-align:center}
.logoCard img{width:min(250px,78%);height:auto}
.spin{display:block;width:64px;height:64px;margin:0 auto 8px;border-radius:50%;background:#fff center/contain no-repeat}
.who{font-size:13px;text-align:right;line-height:1.2;max-width:150px}
h2{font-family:var(--display);font-size:20px;font-weight:600;margin:24px 0 8px;text-wrap:balance}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;border-color:transparent;color:inherit;padding:8px 10px}
button.danger{color:var(--bad)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{flex:1}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-weight:400}
.card.fin{border-left-color:var(--ok)}
.card b{display:block;font-size:17px;font-weight:600}
.card span{color:var(--muted);font-size:14px}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:6px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid currentColor;color:var(--accent);white-space:nowrap}
.pill.fin{color:var(--ok)}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:14px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{display:block;color:var(--ink);font-size:16px;overflow-wrap:anywhere}
label.f{display:grid;gap:5px;font-size:14px;font-weight:600}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:disabled,textarea:disabled,select:disabled{opacity:1;color:var(--ink)}
.q{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0;padding-bottom:0}
.q p{margin:0;font-weight:500}
.q p i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg.two{grid-template-columns:repeat(2,1fr)}
label.opt{position:relative;border:1px solid var(--line);border-radius:8px;padding:10px 4px;text-align:center;font-weight:600;background:var(--bg);cursor:pointer}
label.opt input{position:absolute;opacity:0;inset:0}
label.opt.on.si{background:var(--ok);border-color:var(--ok);color:#fff}
label.opt.on.no{background:var(--bad);border-color:var(--bad);color:#fff}
label.opt.on.na{background:var(--na);border-color:var(--na);color:#fff}
.sig{display:grid;gap:6px}
.sig .hd{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.sig canvas,.sig img{width:100%;height:150px;background:#fff;border:1px dashed #8a929a;border-radius:8px;touch-action:none;display:block;object-fit:contain}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fotos figure{margin:0;position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos figure button{position:absolute;top:4px;right:4px;padding:2px 9px;border-radius:99px;background:#000b;color:#fff;border:0}
.files{display:grid;gap:8px}
.file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.file a{flex:1;color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.add{display:block;text-align:center;border:1px dashed var(--accent);color:var(--accent);border-radius:8px;padding:12px;font-weight:600;cursor:pointer;position:relative}
.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tabs.wrapt{display:grid;grid-template-columns:repeat(3,1fr)}.tabs.wrapt button{padding:10px 4px}
#adm{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.chk{display:flex;gap:10px;align-items:center;font-weight:500}
label.chk input{width:22px;height:22px;accent-color:var(--accent)}
#dlgF{display:grid;gap:12px;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.tile span{display:block;font-size:13px;color:var(--muted)}
.tile b{font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
#stats .seg button,#dash .seg button{padding:8px 4px;background:var(--bg)}
#stats .seg button.on,#dash .seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st{font-size:17px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav b{font-family:var(--display);font-size:18px;text-align:center}
.nav button{padding:8px 16px;font-size:20px;line-height:1}
#dash{display:grid;gap:14px}
.hb{display:grid;gap:5px}
.hbt{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hbt span{overflow-wrap:anywhere}
.hbt b{white-space:nowrap;font-variant-numeric:tabular-nums}
.hbk{height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.hbk i{display:block;height:100%;background:var(--accent);border-radius:0 5px 5px 0}
.hbk i.ok{background:var(--ok)}
.donas{display:grid;gap:14px}
.dn{display:flex;gap:14px;align-items:center}
.dn svg{width:92px;height:92px;flex:none}
.dn .dt{fill:var(--ink);font-family:var(--display);font-size:19px;font-weight:700}
.dn .trk{stroke:var(--line)} .dn .arc{stroke:var(--accent)} .dn .arc.ok{stroke:var(--ok)}
.dn div{display:grid;gap:2px;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.dn div b{font-size:16px;color:var(--ink)}
.lectura{margin:0;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.lectura b{color:var(--ink)}
.graf{width:100%;height:auto;display:block}
.graf .gl{stroke:var(--line);stroke-width:1}
.graf .gt{fill:var(--muted);font-size:9px;font-family:var(--body);font-variant-numeric:tabular-nums}
.graf .bar{fill:var(--accent);opacity:.55}
.graf .b{cursor:pointer;outline:none}
.graf .b.sel .bar{opacity:1}
.graf .b:focus-visible rect{stroke:var(--accent);stroke-width:1}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--bad);font-weight:600;margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .in button{flex:1}
.bar .saved{flex:0 0 100%;font-size:12px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);max-width:min(420px,calc(100% - 32px));padding:18px}
dialog::backdrop{background:#0008}
dialog h3{font-family:var(--display);font-size:19px;margin:0 0 8px}
dialog p{margin:0 0 16px;white-space:pre-line}
dialog .act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><img data-logo="encabezado" alt="S.I.S.E.R.O"><small>SUPERVISIONES</small></div>
  <div class="who" id="who" hidden></div>
  <button class="ghost" id="btnBack" hidden>← Bandeja</button>
  <button class="ghost" id="btnSalir" hidden>Salir</button>
</div></header>

<main class="wrap">
  <section id="vLogin" hidden>
    <div class="logoCard"><img data-logo="login" alt="S.I.S.E.R.O, Sistema Integral de Seguridad Electrónica para Operaciones Remotas"></div>
    <h2>Supervisiones · Iniciar sesión</h2>
    <form class="sec" id="fLogin">
      <label class="f" for="lUsuario">Usuario<input type="text" id="lUsuario" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="f" for="lPass">Contraseña<input type="password" id="lPass" autocomplete="current-password"></label>
      <p class="err" id="lMsg" hidden></p>
      <button class="pri" id="lBtn" type="submit">Entrar</button>
    </form>
  </section>

  <section id="vLista" hidden>
    <button class="pri" id="btnNueva" style="width:100%;margin-top:16px;padding:14px">+ Nueva supervisión</button>
    <div class="two" id="admBtns" style="margin-top:10px" hidden><button id="btnDash">Gráficas</button><button id="btnAdmin">Panel de administrador</button></div>
    <div class="sec" id="stats" style="margin-top:16px"><p class="hint">Cargando estadísticas…</p></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabProc" aria-selected="true">En proceso (<span id="nProc">0</span>)</button>
      <button role="tab" id="tabFin" aria-selected="false">Finalizadas (<span id="nFin">0</span>)</button>
    </div>
    <div id="lista"></div>
  </section>

  <section id="vDash" hidden>
    <h2>Gráficas de supervisiones</h2>
    <div id="dash"></div>
  </section>

  <section id="vAdmin" hidden>
    <h2>Panel de administrador</h2>
    <div class="tabs wrapt" role="tablist" id="aTabs"></div>
    <div id="adm"></div>
  </section>

  <section id="vForm" hidden></section>
</main>

<div class="bar" id="bar" hidden><div class="in">
  <span class="saved" id="saved"></span>
  <button id="btnGuardar">Guardar y salir</button>
  <button class="pri" id="btnFin">Finalizar supervisión</button>
</div></div>

<dialog id="dlg"><h3 id="dlgT"></h3><p id="dlgB"></p><form id="dlgF"></form>
  <div class="act"><button id="dlgNo">Cancelar</button><button class="pri" id="dlgOk">Aceptar</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* ====== CONFIGURACIÓN: pega aquí los datos de tu proyecto de Supabase ====== */
const CFG = {
  url: "https://noolfrypryyfrnkqdhzo.supabase.co",   // Project URL
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vb2xmcnlwcnl5ZnJua3FkaHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzNTg1OTEsImV4cCI6MjEwOTkzNDU5MX0.K-VeXTw8CuRslFiVuLbs2V52zoaEhK_yw4Lyyh2jCjg",   // clave anon (pública)
  dominio: "sisero.com.mx",   // el usuario "jperez" entra como jperez@sisero.com.mx
  bucket: "supervisiones"
};

/* ====== Preguntas del formato ====== */
const PREGUNTAS = [
 "¿Porta su credencial y permisos de portación de arma (si aplica) vigentes?",
 "¿Tiene identificaciones de la empresa y para el cliente?",
 "¿Las botas de seguridad están en buenas condiciones?",
 "¿El equipo (radio, linterna, etc.) funciona correctamente?",
 "¿Si aplica, porta y se encuentra en buen estado su chaleco antibalas?",
 "Si usa arma, ¿está limpia, en buen estado y tiene las municiones autorizadas?",
 "¿Conoce los protocolos para diferentes tipos de emergencias (incendio, médicas, etc.)?",
 "¿Conoce las salidas y rutas de emergencia del lugar?",
 "¿Sabe utilizar los equipos de comunicación (radios)?",
 "¿Conoce los procedimientos para el control de accesos y el registro de visitantes?",
 "¿Realizó la ronda de inspección inicial del perímetro?",
 "¿Todos los puntos de acceso están seguros?",
 "¿Las cámaras de vigilancia y los sistemas de alarma están operativos?",
 "¿Identificó posibles riesgos o fallas en la seguridad del área?",
 "¿Tiene clara su bitácora y los informes del turno anterior?",
 "¿Tiene la información sobre incidentes recientes?",
 "¿Demuestra atención, profesionalismo y buena comunicación?",
 "¿Mantiene la discreción y confidencialidad sobre la información sensible?"
];
const MAX_FOTOS = 5, MAX_ARCH = 3, MAX_MB = 5;

/* ====== Estado ====== */
let sb = null, uid = null, perfil = null;
let CAT = { loc: [], cli: [], srv: [] };
let tab = "En proceso", cur = null, timer = null;
const URLS = {};   // ruta en Storage -> URL para mostrarla

/* ====== Utilidades ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const p2 = n => String(n).padStart(2, "0");
const hora = d => p2(d.getHours()) + ":" + p2(d.getMinutes());
const fecha = d => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
const respondidas = o => PREGUNTAS.filter((_, i) => o.respuestas[i]).length;
const ver = v => ["vLogin", "vLista", "vDash", "vAdmin", "vForm"].forEach(id => $(id).hidden = id !== v);

function ask(titulo, cuerpo, ok, cancelar, html) {
  return new Promise(res => {
    $("dlgT").textContent = titulo; $("dlgB").textContent = cuerpo; $("dlgB").hidden = !cuerpo;
    $("dlgF").innerHTML = html || ""; $("dlgF").hidden = !html; $("dlgF").onsubmit = e => { e.preventDefault(); $("dlgOk").click(); };
    $("dlgOk").textContent = ok || "Aceptar"; $("dlgNo").textContent = cancelar || "Cancelar";
    $("dlgNo").hidden = cancelar === null;
    const d = $("dlg"); const fin = v => { d.close(); res(v); };
    $("dlgOk").onclick = () => fin(true); $("dlgNo").onclick = () => fin(false); d.oncancel = () => res(false);
    d.showModal();
  });
}
const aviso = (t, m) => ask(t, m, "Entendido", null);

/* ====== Inicio de sesión ====== */
function verLogin(msg) {
  uid = null; perfil = null; cur = null;
  ver("vLogin"); $("bar").hidden = true;
  ["who", "btnBack", "btnSalir"].forEach(id => $(id).hidden = true);
  $("lMsg").textContent = msg || ""; $("lMsg").hidden = !msg; $("lPass").value = "";
}
async function iniciar() {
  if (!window.supabase || !CFG.url || !CFG.key) {
    verLogin(!window.supabase ? "No se pudo cargar la conexión. Revisa tu internet y vuelve a abrir la página." : "Falta configurar la conexión a Supabase (url y key al inicio del código).");
    $("lBtn").disabled = true; return;
  }
  sb = window.supabase.createClient(CFG.url, CFG.key);
  const { data } = await sb.auth.getSession();
  if (data && data.session) entrar(data.session.user); else verLogin();
}
$("fLogin").onsubmit = async e => {
  e.preventDefault();
  const u = $("lUsuario").value.trim().toLowerCase(), p = $("lPass").value;
  if (!u || !p) { $("lMsg").textContent = "Escribe tu usuario y tu contraseña."; $("lMsg").hidden = false; return; }
  $("lBtn").disabled = true; $("lBtn").textContent = "Entrando…";
  const { data, error } = await sb.auth.signInWithPassword({ email: u.includes("@") ? u : u + "@" + CFG.dominio, password: p });
  $("lBtn").disabled = false; $("lBtn").textContent = "Entrar";
  if (error) return verLogin(/invalid/i.test(error.message) ? "Usuario o contraseña incorrectos." : "No se pudo iniciar sesión. Revisa tu internet e intenta de nuevo.");
  entrar(data.user);
};
async function entrar(user) {
  uid = user.id;
  const { data, error } = await sb.from("sup_supervisores").select("nombre,usuario,rol,activo").eq("id", uid).maybeSingle();
  if (error) return verLogin("No se pudo consultar tu usuario. Revisa tu internet e intenta de nuevo.");
  if (!data || !data.activo) { await sb.auth.signOut(); return verLogin("Tu usuario no está dado de alta o está inactivo. Avisa al administrador."); }
  perfil = data;
  $("who").textContent = perfil.nombre; $("who").hidden = false;
  await cargarCatalogos();
  if (perfil.rol === "monitor") verDash(); else verLista();
}
async function cargarCatalogos() {
  const [a, b, c] = await Promise.all([
    sb.from("sup_localidades").select("nombre").order("nombre"),
    sb.from("sup_clientes").select("id,nombre,localidad").order("nombre").order("localidad"),
    sb.from("sup_servicios").select("id,nombre,localidad,cliente").order("nombre")
  ]);
  CAT = { loc: a.data || [], cli: b.data || [], srv: c.data || [] };
}
$("btnSalir").onclick = async () => {
  if (await ask("Cerrar sesión", "¿Salir de la app en este dispositivo?", "Salir")) { await sb.auth.signOut(); verLogin(); }
};

/* ====== Bandeja ====== */
async function verLista() {
  cur = null; clearTimeout(timer);
  ver("vLista"); $("bar").hidden = true; $("btnBack").hidden = true; $("btnSalir").hidden = false;
  $("admBtns").hidden = perfil.rol !== "admin"; cargarStats();
  $("lista").innerHTML = `<p class="empty"><span class="spin"></span>Cargando…</p>`;
  const { data, error } = await sb.from("sup_supervisiones").select("*").order("actualizado", { ascending: false }).limit(300);
  if (error) { $("lista").innerHTML = `<p class="empty">No se pudo cargar la bandeja. Revisa tu internet y vuelve a intentar.</p>`; return; }
  const all = data || [];
  const proc = all.filter(o => o.estatus === "En proceso"), fin = all.filter(o => o.estatus === "Finalizada");
  $("nProc").textContent = proc.length; $("nFin").textContent = fin.length;
  $("tabProc").setAttribute("aria-selected", tab === "En proceso"); $("tabFin").setAttribute("aria-selected", tab === "Finalizada");
  const rows = tab === "En proceso" ? proc : fin;
  $("lista").innerHTML = rows.length ? rows.map(o => `
    <button class="card ${o.estatus === "Finalizada" ? "fin" : ""}" data-id="${esc(o.id)}">
      <b>${esc(o.servicio || "Servicio sin seleccionar")}</b>
      <span>Guardia: ${esc(o.guardia || "sin capturar")}${perfil.rol === "admin" ? " · Supervisor: " + esc(o.supervisor) : ""}</span>
      <div class="row"><span>${esc(o.fecha)} · ${esc(o.hora_inicio)}${o.hora_fin ? " a " + esc(o.hora_fin) : ""} · ${respondidas(o)}/${PREGUNTAS.length} puntos · ${o.evidencias.length} fotos</span>
      <span class="pill ${o.estatus === "Finalizada" ? "fin" : ""}">${esc(o.estatus)}</span></div>
    </button>`).join("")
    : `<p class="empty">${tab === "En proceso" ? "No hay supervisiones en proceso. Toca “Nueva supervisión” para empezar." : "Todavía no hay supervisiones finalizadas."}</p>`;

/* ---- Guardado automático en Supabase ---- */
function guardarLuego() { clearTimeout(timer); $("saved").textContent = "Guardando…"; timer = setTimeout(guardar, 700); }
async function guardar() {
  clearTimeout(timer); const o = cur; if (!o) return true;
  const fila = { ...o, actualizado: new Date().toISOString() };
  const { error } = await sb.from("sup_supervisiones").update(fila).eq("id", o.id);
  if (cur === o) $("saved").textContent = error ? "⚠ Sin guardar: no hay conexión. Se reintenta con el siguiente cambio o al tocar Guardar." : "Guardado a las " + hora(new Date()) + " · " + o.estatus;
  return !error;
}

/* ---- Firma en pantalla ---- */
function iniciarFirma(c) {
  const k = c.dataset.sig, ctx = c.getContext("2d"); let on = false;
  ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#101820";
  if (cur[k]) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, c.width, c.height); im.src = cur[k]; }
  const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.onpointerdown = e => { on = true; c.setPointerCapture(e.pointerId); const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + .1, y + .1); ctx.stroke(); e.preventDefault(); };
  c.onpointermove = e => { if (!on) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); };
  c.onpointerup = c.onpointercancel = () => { if (!on) return; on = false; cur[k] = c.toDataURL("image/png"); guardarLuego(); };
}

/* ---- Almacenamiento (Supabase Storage) ---- */
async function cargarUrls(rutas) {
  const faltan = rutas.filter(r => !URLS[r]); if (!faltan.length) return;
  const { data } = await sb.storage.from(CFG.bucket).createSignedUrls(faltan, 3600);
  (data || []).forEach((d, i) => { if (d && d.signedUrl) URLS[faltan[i]] = d.signedUrl; });
}
async function subir(ruta, blob, tipo) {
  const { error } = await sb.storage.from(CFG.bucket).upload(ruta, blob, { contentType: tipo || "application/octet-stream" });
  if (error) throw error;
  URLS[ruta] = URL.createObjectURL(blob);
}
const carpeta = o => o.supervisor_id + "/" + o.id + "/";

/* ---- Fotos de evidencia (hasta 5) ---- */
async function pintarFotos() {
  const o = cur, ro = $("bar").hidden;
  await cargarUrls(o.evidencias); if (cur !== o) return;
  $("fotos").innerHTML = o.evidencias.map((r, i) => `<figure>${URLS[r] ? `<img src="${esc(URLS[r])}" alt="Evidencia ${i + 1}">` : ""}${ro ? "" : `<button type="button" data-rm="${i}" aria-label="Quitar evidencia ${i + 1}">✕</button>`}</figure>`).join("")
    || (ro ? `<p class="hint">Sin fotos.</p>` : "");
  if (ro) return;
  $("fotos").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    const [r] = o.evidencias.splice(+b.dataset.rm, 1); sb.storage.from(CFG.bucket).remove([r]); pintarFotos(); guardarLuego();
  });
  $("addFoto").hidden = o.evidencias.length >= MAX_FOTOS;
  $("addTxt").textContent = `+ Agregar foto (${o.evidencias.length} de ${MAX_FOTOS})`;
}
function comprimir(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(), "image/jpeg", .6);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); }; im.src = url;
  });
}
async function agregarFotos(e) {
  const o = cur, files = [...e.target.files], quedan = MAX_FOTOS - o.evidencias.length; let fallas = 0;
  e.target.value = ""; $("addTxt").textContent = "Subiendo fotos…";
  for (const [i, f] of files.slice(0, quedan).entries()) {
    try { const b = await comprimir(f), ruta = carpeta(o) + "ev-" + Date.now() + "-" + i + ".jpg"; await subir(ruta, b, "image/jpeg"); o.evidencias.push(ruta); }
    catch (err) { fallas++; }
  }
  if (cur === o) { pintarFotos(); guardarLuego(); }
  if (fallas) aviso("Fotos sin subir", `No se pudieron subir ${fallas} fotos. Revisa tu internet y agrégalas de nuevo.`);
  else if (files.length > quedan) aviso("Límite de fotos", `Solo se permiten ${MAX_FOTOS} fotos por supervisión. Se agregaron las primeras ${quedan}.`);
}

/* ---- Archivos adjuntos (PDF, imagen, Word, Excel) ---- */
async function pintarArchivos() {
  const o = cur, ro = $("bar").hidden;
  await cargarUrls(o.archivos.map(a => a.ruta)); if (cur !== o) return;
  $("archivos").innerHTML = o.archivos.map((a, i) => `<div class="file">${URLS[a.ruta] ? `<a href="${esc(URLS[a.ruta])}" target="_blank" rel="noopener">${esc(a.nombre)}</a>` : `<span style="flex:1">${esc(a.nombre)}</span>`}${ro ? "" : `<button type="button" class="ghost" data-ra="${i}" aria-label="Quitar ${esc(a.nombre)}">✕</button>`}</div>`).join("")
    || (ro ? `<p class="hint">Sin archivos.</p>` : "");
  if (ro) return;
  $("archivos").querySelectorAll("[data-ra]").forEach(b => b.onclick = () => {
    const [a] = o.archivos.splice(+b.dataset.ra, 1); sb.storage.from(CFG.bucket).remove([a.ruta]); pintarArchivos(); guardarLuego();
  });
  $("addArch").hidden = o.archivos.length >= MAX_ARCH;
  $("addArchTxt").textContent = `+ Adjuntar archivo (${o.archivos.length} de ${MAX_ARCH})`;
}
async function agregarArchivos(e) {
  const o = cur, files = [...e.target.files], quedan = MAX_ARCH - o.archivos.length, malos = [];
  e.target.value = ""; $("addArchTxt").textContent = "Subiendo archivos…";
  for (const [i, f] of files.slice(0, quedan).entries()) {
    if (f.size > MAX_MB * 1048576) { malos.push(f.name + " (pesa más de " + MAX_MB + " MB)"); continue; }
    const limpio = f.name.normalize("NFD").replace(/[^\w.\-]+/g, "_").slice(-80);
    try { const ruta = carpeta(o) + "ar-" + Date.now() + "-" + i + "-" + limpio; await subir(ruta, f, f.type); o.archivos.push({ nombre: f.name, ruta }); }
    catch (err) { malos.push(f.name + " (falló la subida)"); }
  }
  if (cur === o) { pintarArchivos(); guardarLuego(); }
  if (malos.length) aviso("Archivos sin adjuntar", "• " + malos.join("\n• "));
  else if (files.length > quedan) aviso("Límite de archivos", `Solo se permiten ${MAX_ARCH} archivos por supervisión. Se agregaron los primeros ${quedan}.`);
}

/* ---- GPS ---- */
function tomarGPS(silencioso) {
  const o = cur; if (!o) return;
  const falla = m => { if (!silencioso) aviso("Sin ubicación", m); };
  if (!navigator.geolocation) return falla("Este celular o navegador no permite tomar la ubicación.");
  navigator.geolocation.getCurrentPosition(p => {
    o.coordenadas = p.coords.latitude.toFixed(6) + ", " + p.coords.longitude.toFixed(6);
    if (cur === o) { $("coordsTxt").textContent = o.coordenadas; guardarLuego(); }
    else if (o.estatus === "En proceso") sb.from("sup_supervisiones").update({ coordenadas: o.coordenadas }).eq("id", o.id).then(() => {});
  }, () => falla("No se pudo tomar la ubicación. Activa el GPS y da permiso de ubicación al navegador."), { enableHighAccuracy: true, timeout: 15000 });
}

function errDb(error) {

}
const filaAdm = (i, txt, sub, extra) => `<div class="file"><span style="flex:1;overflow-wrap:anywhere"><b>${esc(txt)}</b>${sub ? `<br><span class="hint">${esc(sub)}</span>` : ""}</span>${extra || ""}

/* ====== Gráficas ====== */
const MESES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const est = (g, desde, hasta, dim) => sb.rpc("sup_estadistica", { p_grano: g, p_desde: desde, p_hasta: hasta, p_dim: dim || "" });
const sumar = (rows, k) => { const m = {}; (rows || []).forEach(x => m[x[k]] = (m[x[k]] || 0) + Number(x.total)); return m; };
const plural = n => n === 1 ? "supervisión" : "supervisiones";
function rango(g, ref) {   // primer y último día del periodo que contiene a ref
  const y = ref.getFullYear(), m = ref.getMonth();
  if (g === "day") return [fecha(ref), fecha(ref)];
  if (g === "month") return [`${y}-${p2(m + 1)}-01`, `${y}-${p2(m + 1)}-${p2(new Date(y, m + 1, 0).getDate())}`];
  return [`${y}-01-01`, `${y}-12-31`];
}
function contexto(g, ref) {   // lo que muestra la gráfica de tiempo: días del mes, meses del año o últimos 5 años
  if (g === "day") return ["day", ...rango("month", ref)];
  if (g === "month") return ["month", ...rango("year", ref)];
  return ["year", `${ref.getFullYear() - 4}-01-01`, `${ref.getFullYear()}-12-31`];
}
const etiqueta = (g, ref) => g === "day" ? `${ref.getDate()} de ${MESES[ref.getMonth()].toLowerCase()} ${ref.getFullYear()}` : g === "month" ? `${MESES[ref.getMonth()]} ${ref.getFullYear()}` : `Año ${ref.getFullYear()}`;
function serieTiempo(g, ref, S) {   // S: {"2026-11-01": 3, ...}
  const y = ref.getFullYear(), mm = p2(ref.getMonth() + 1), pts = [];
  if (g === "day") {
    const n = new Date(y, ref.getMonth() + 1, 0).getDate();
    for (let i = 1; i <= n; i++) pts.push({ etq: i === 1 || i % 5 === 0 ? String(i) : "", nom: i + " de " + MESES[ref.getMonth()].toLowerCase(), v: S[`${y}-${mm}-${p2(i)}`] || 0 });
    return { pts, actual: ref.getDate() - 1 };
  }
  if (g === "month") { MESES.forEach((n, i) => pts.push({ etq: n, nom: n + " " + y, v: S[`${y}-${p2(i + 1)}-01`] || 0 })); return { pts, actual: ref.getMonth() }; }
  for (let a = y - 4; a <= y; a++) pts.push({ etq: String(a), nom: "Año " + a, v: S[`${a}-01-01`] || 0 });
  return { pts, actual: 4 };
}
/* Barras verticales, una sola serie: eje desde cero, rejilla discreta, barras delgadas con punta redondeada */
function svgBarras(pts, aria) {
  const W = 320, H = 168, L = 26, R = 6, T = 10, B = 22, pw = W - L - R, ph = H - T - B;
  let max = Math.max(2, ...pts.map(p => p.v)); if (max % 2) max++;
  const slot = pw / pts.length, bw = Math.min(26, Math.max(3, slot - 2)), yv = v => T + ph - (v / max) * ph;
  const grid = [0, max / 2, max].map(v => `<line x1="${L}" x2="${W - R}" y1="${yv(v)}" y2="${yv(v)}" class="gl"/><text x="${L - 5}" y="${yv(v) + 3.5}" text-anchor="end" class="gt">${v}</text>`).join("");
  const bars = pts.map((p, i) => {
    const x = L + i * slot + (slot - bw) / 2, h = (p.v / max) * ph, r = Math.min(4, bw / 2, h), y0 = T + ph;
    const bar = h > 0 ? `<path class="bar" d="M${x},${y0} V${y0 - h + r} Q${x},${y0 - h} ${x + r},${y0 - h} H${x + bw - r} Q${x + bw},${y0 - h} ${x + bw},${y0 - h + r} V${y0} Z"/>` : "";
    return `<g class="b" data-i="${i}" tabindex="0" role="img" aria-label="${esc(p.nom)}: ${p.v} ${plural(p.v)}">${bar}<rect x="${L + i * slot}" y="${T}" width="${slot}" height="${ph + B}" fill="transparent"/>${p.etq ? `<text x="${L + i * slot + slot / 2}" y="${H - 6}" text-anchor="middle" class="gt">${p.etq}</text>` : ""}</g>`;
  }).join("");
  return `<p class="lectura"></p><svg viewBox="0 0 ${W} ${H}" class="graf" role="group" aria-label="${esc(aria)}">${grid}${bars}</svg>`;
}

const barrasH = filas => filas.map(f => `<div class="hb"><div class="hbt"><span>${esc(f.nom)}</span><b>${esc(f.txt)}</b></div><div class="hbk"><i class="${f.ok ? "ok" : ""}" style="width:${Math.max(0, Math.min(100, f.pct))}%"></i></div></div>`).join("");
const ranking = (m, vacio) => { const r = Object.entries(m).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])), mx = r.length ? r[0][1] : 1; return r.length ? barrasH(r.map(([nom, v]) => ({ nom, txt: String(v), pct: v / mx * 100 }))) : `<p class="hint">${vacio}</p>`; };
const segPeriodo = act => `<div class="seg">${[["day", "Por día"], ["month", "Por mes"], ["year", "Por año"]].map(([k, l]) => `<button type="button" class="${k === act ? "on" : ""}" data-g="${k}" aria-pressed="${k === act}">${l}</button>`).join("")}</div>`;
const ariaTiempo = g => "Supervisiones finalizadas " + (g === "day" ? "por día del mes" : g === "month" ? "por mes del año" : "por año");

/* ---- Supervisor: sus propias gráficas en la bandeja ---- */
let gTab = "day", STATS = null;
async function cargarStats() {
  $("stats").hidden = perfil.rol !== "supervisor"; if (perfil.rol !== "supervisor") return;
  const d = new Date(), r = await Promise.all(["day", "month", "year"].map(g => est(...contexto(g, d), "")));
  if (r.some(x => x.error)) { STATS = null; $("stats").innerHTML = `<p class="hint">No se pudieron cargar las gráficas. Revisa tu internet.</p>`; return; }
  STATS = { day: sumar(r[0].data, "periodo"), month: sumar(r[1].data, "periodo"), year: sumar(r[2].data, "periodo") }; pintarStats();
}
function pintarStats() {
  if (!STATS || !perfil) return;
  const d = new Date(), y = d.getFullYear(), { pts, actual } = serieTiempo(gTab, d, STATS[gTab]);
  const hoy = STATS.day[fecha(d)] || 0, mes = STATS.month[`${y}-${p2(d.getMonth() + 1)}-01`] || 0, anio = STATS.year[`${y}-01-01`] || 0;
  $("stats").innerHTML = `<b class="st">Mis supervisiones finalizadas</b>
    <div class="tiles"><div class="tile"><span>Hoy</span><b>${hoy}</b></div><div class="tile"><span>${MESES[d.getMonth()]} ${y}</span><b>${mes}</b></div><div class="tile"><span>Año ${y}</span><b>${anio}</b></div></div>
    ${segPeriodo(gTab)}${svgBarras(pts, ariaTiempo(gTab))}`;
  activarLectura($("stats"), pts, actual);
  $("stats").querySelectorAll("[data-g]").forEach(b => b.onclick = () => { gTab = b.dataset.g; pintarStats(); });
}

/* ---- Administrador y monitorista: tablero general ---- */
let dG = "month", dRef = new Date(), dSeq = 0;
function verDash() {
  cur = null; clearTimeout(timer);
  ver("vDash"); $("bar").hidden = true; $("btnBack").hidden = perfil.rol === "monitor"; $("btnSalir").hidden = perfil.rol !== "monitor";
  pintarDash();
}
async function pintarDash() {
  const D = $("dash"), seq = ++dSeq, mg = dG === "year" ? "year" : "month";   // las metas son mensuales: en vista por día se compara el mes
  const [pD, pH] = rango(dG, dRef), [cg, cD, cH] = contexto(dG, dRef), [mD, mH] = rango(mg, dRef);
  const cab = `<div class="sec">${segPeriodo(dG)}<div class="nav"><button type="button" data-n="-1" aria-label="Periodo anterior">‹</button><b>${etiqueta(dG, dRef)}</b><button type="button" data-n="1" aria-label="Periodo siguiente">›</button></div></div>`;
  const ligar = () => {
    D.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { dG = b.dataset.g; pintarDash(); });
    D.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
      const n = +b.dataset.n, y = dRef.getFullYear(), m = dRef.getMonth();
      dRef = dG === "day" ? new Date(y, m, dRef.getDate() + n) : dG === "month" ? new Date(y, m + n, 1) : new Date(y + n, m, 1); pintarDash();
    });
  };
  D.innerHTML = cab + `<p class="empty"><span class="spin"></span>Cargando…</p>`; ligar();
  const [t, s, v, l, me] = await Promise.all([est(cg, cD, cH, ""), est(dG, pD, pH, "supervisor"), est(dG, pD, pH, "servicio"), est(mg, mD, mH, "localidad"),
    sb.from("sup_metas").select("meta,sup_metas_localidades(localidad)").gte("mes", mD).lte("mes", mH)]);
  if (seq !== dSeq) return;
  if ([t, s, v, l, me].some(x => x.error)) { D.innerHTML = cab + `<p class="empty">No se pudieron cargar las gráficas. Revisa tu internet.</p>`; ligar(); return; }

  const porSup = sumar(s.data, "grupo"), porSrv = sumar(v.data, "grupo"), porLoc = sumar(l.data, "grupo"), grupos = {};
  // Cada meta cubre una o varias localidades; se suman las supervisiones de todas las del grupo
  (me.data || []).forEach(x => {
    const locs = (x.sup_metas_localidades || []).map(r => r.localidad).sort((a, b) => a.localeCompare(b)), k = locs.join(", ");
    (grupos[k] = grupos[k] || { nom: k, locs, meta: 0 }).meta += x.meta;
  });
  const G = Object.values(grupos).map(g => ({ ...g, h: g.locs.reduce((a, n) => a + (porLoc[n] || 0), 0) })).sort((a, b) => a.nom.localeCompare(b.nom));
  const conMeta = new Set(G.flatMap(g => g.locs)), sinMeta = Object.entries(porLoc).filter(([n]) => !conMeta.has(n));
  const total = Object.values(porSup).reduce((a, b) => a + b, 0), hechas = [...conMeta].reduce((a, n) => a + (porLoc[n] || 0), 0), metaT = G.reduce((a, g) => a + g.meta, 0);
  const etqM = etiqueta(mg, dRef), pctT = metaT ? Math.min(100, Math.round(hechas / metaT * 100)) : null;
  const pastel = (nom, h, m) => {   // pastel de avance: parte hecha contra la meta
    const pct = Math.min(100, Math.round(h / m * 100)), ok = h >= m;   // si rebasa la meta se queda en 100%
    const C = 2 * Math.PI * 38, arco = Math.min(1, h / m) * C;
    return `<div class="dn"><svg viewBox="0 0 100 100" role="img" aria-label="${esc(nom)}: ${pct}% de la meta">
      <circle cx="50" cy="50" r="38" fill="none" stroke-width="16" class="trk"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke-width="16" class="arc ${ok ? "ok" : ""}" stroke-dasharray="${arco} ${C}" transform="rotate(-90 50 50)"/>
      <text x="50" y="58" text-anchor="middle" class="dt">${pct}%</text></svg>
      <div><b>${esc(nom)}</b><span>${h} de ${m} supervisiones</span><span>${ok ? "✓ Meta cumplida" : "Faltan " + (m - h)}</span></div></div>`;
  };
  const { pts, actual } = serieTiempo(dG, dRef, sumar(t.data, "periodo"));

  D.innerHTML = cab + `
    <div class="tiles"><div class="tile"><span>Finalizadas · ${etiqueta(dG, dRef)}</span><b>${total}</b></div><div class="tile"><span>Meta · ${etqM}</span><b>${metaT || "—"}</b></div><div class="tile"><span>Avance · ${etqM}</span><b>${pctT === null ? "—" : pctT + "%"}</b></div></div>
    <div class="sec"><b class="st">META SUPERVISIONES · ${etqM}</b>
      ${G.length ? `<div class="donas">${G.length > 1 ? pastel("Total", hechas, metaT) : ""}${G.map(g => pastel(g.nom, g.h, g.meta)).join("")}</div>`
        : `<p class="hint">No hay metas capturadas para ${etqM}.${perfil.rol === "admin" ? " Captúralas en Panel de administrador > Metas." : ""}</p>`}
      ${sinMeta.length ? `<p class="hint">Sin meta asignada: ${sinMeta.map(([n, c]) => esc(n) + " (" + c + ")").join(", ")}</p>` : ""}</div>
    <div class="sec" id="dTiempo"><b class="st">${dG === "day" ? "Por día · " + etiqueta("month", dRef) : dG === "month" ? "Por mes · Año " + dRef.getFullYear() : "Por año"}</b>${svgBarras(pts, ariaTiempo(dG))}</div>
    <div class="sec"><b class="st">Por supervisor · ${etiqueta(dG, dRef)}</b>${ranking(porSup, "Sin supervisiones finalizadas en este periodo.")}</div>
    <div class="sec"><b class="st">Por servicio o sucursal · ${etiqueta(dG, dRef)}</b>${ranking(porSrv, "Sin supervisiones finalizadas en este periodo.")}</div>`;
  ligar(); activarLectura($("dTiempo"), pts, actual);
}

/* ====== PDF de la supervisión (se genera en el celular o la computadora, no ocupa espacio en Supabase) ====== */
function cargarJsPDF() {
  return window.jspdf ? Promise.resolve() : new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
const aDataUrl = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
const medir = src => new Promise(res => { const im = new Image(); im.onload = () => res([im.naturalWidth, im.naturalHeight]); im.onerror = () => res([4, 3]); im.src = src; });

async function crearPDF(o, btn) {
  const txt = btn.textContent; btn.disabled = true; btn.textContent = "Creando PDF…";
  try {
    await cargarJsPDF();
    const fotos = [];
    for (const r of o.evidencias) {
      const { data, error } = await sb.storage.from(CFG.bucket).download(r);
      if (!error && data) { const u = await aDataUrl(data); fotos.push({ u, d: await medir(u) }); }
    }
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter" });
    const W = 215.9, H = 279.4, M = 14, CW = W - 2 * M, NAVY = [10, 26, 51], AZUL = [47, 98, 163], GRIS = [95, 104, 118], LINEA = [211, 219, 230], OK = [31, 122, 77], MAL = [179, 38, 30];
    let y = 0;
    const color = c => doc.setTextColor(c[0], c[1], c[2]);
    const fuente = (t, estilo, c) => { doc.setFont("helvetica", estilo || "normal"); doc.setFontSize(t); color(c || NAVY); };
    const salto = h => { if (y + h > H - 18) { doc.addPage(); y = 16; } };
    const titulo = t => { salto(16); y += 4; doc.setFillColor(...AZUL); doc.rect(M, y - 3.4, 1.6, 4.6, "F"); fuente(10.5, "bold"); doc.text(t, M + 4, y); y += 6; };
    const parrafo = t => { fuente(9.5); const ls = doc.splitTextToSize(t || "Sin observaciones.", CW - 6), h = ls.length * 4.4 + 5; salto(h); doc.setDrawColor(...LINEA); doc.setFillColor(247, 249, 252); doc.roundedRect(M, y - 1, CW, h, 1.5, 1.5, "FD"); if (!t) color(GRIS); doc.text(ls, M + 3, y + 4); y += h + 2; };

    // Encabezado
    doc.setFillColor(...NAVY); doc.rect(0, 0, W, 30, "F");
    doc.addImage(LOGOS.encabezado, "PNG", M - 2, 7, 54.9, 16);
    fuente(15, "bold", [255, 255, 255]); doc.text("REPORTE DE SUPERVISIÓN", W - M, 14, { align: "right" });
    fuente(8.5, "normal", [159, 180, 212]); doc.text("Folio " + o.id, W - M, 20, { align: "right" });
    y = 40;

    // Datos de la visita (dos columnas)
    const f = o.fecha.split("-"), datos = [
      ["Fecha", `${f[2]}/${f[1]}/${f[0]}`], ["Horario", o.hora_inicio + (o.hora_fin ? " a " + o.hora_fin : "")],
      ["Localidad", o.localidad], ["Cliente", o.cliente], ["Servicio o sucursal", o.servicio], ["Supervisor", o.supervisor],
      ["Guardia en turno", o.guardia], ["Coordenadas", o.coordenadas]];
    for (let i = 0; i < datos.length; i += 2) {
      const col = CW / 2, par = datos.slice(i, i + 2).map(([l, v]) => [l, doc.setFontSize(10.5) && doc.splitTextToSize(v || "Sin dato", col - 6)]);
      const h = Math.max(...par.map(p => p[1].length)) * 4.6 + 6;
      par.forEach(([l, ls], k) => {
        const x = M + k * col; fuente(7.5, "bold", GRIS); doc.text(l.toUpperCase(), x, y);
        fuente(10.5, "bold"); doc.text(ls, x, y + 4.8);
        if (l === "Coordenadas" && o.coordenadas) { fuente(8, "normal", AZUL); doc.textWithLink("Abrir en el mapa", x + doc.getTextWidth(o.coordenadas) * 1.35 + 3, y + 4.8, { url: "https://www.google.com/maps?q=" + encodeURIComponent(o.coordenadas.replace(/\s/g, "")) }); }
      });
      y += h; doc.setDrawColor(...LINEA); doc.line(M, y - 3.2, W - M, y - 3.2); y += 1.5;
    }

    // Resultado
    const R = PREGUNTAS.map((_, i) => o.respuestas[i] || ""), si = R.filter(v => v === "Sí").length, no = R.filter(v => v === "No").length, na = R.filter(v => v === "N/A").length, apl = si + no;
    const pct = apl ? Math.round(si / apl * 100) : null;
    y += 2; doc.setFillColor(238, 243, 250); doc.roundedRect(M, y, CW, 17, 2, 2, "F");
    fuente(20, "bold", pct === null ? GRIS : pct >= 80 ? OK : MAL); doc.text(pct === null ? "—" : pct + "%", M + 5, y + 11.5);
    fuente(9.5, "bold"); doc.text("Cumplimiento de estándares", M + 30, y + 7);
    fuente(8.5, "normal", GRIS); doc.text(`${si} cumple · ${no} no cumple · ${na} no aplica${R.length - si - no - na ? " · " + (R.length - si - no - na) + " sin respuesta" : ""}`, M + 30, y + 12.2);
    doc.setFillColor(...LINEA); doc.roundedRect(M + 118, y + 6.6, 64, 3.6, 1.8, 1.8, "F");
    if (pct) { doc.setFillColor(...(pct >= 80 ? OK : MAL)); doc.roundedRect(M + 118, y + 6.6, 64 * pct / 100, 3.6, 1.8, 1.8, "F"); }
    y += 23;

    // Tabla de estándares
    const cabTabla = () => { doc.setFillColor(...NAVY); doc.rect(M, y, CW, 7, "F"); fuente(8.5, "bold", [255, 255, 255]); doc.text("ESTÁNDARES A VERIFICAR", M + 3, y + 4.8); doc.text("CRITERIO", W - M - 16, y + 4.8, { align: "center" }); y += 7; };
    cabTabla();
    PREGUNTAS.forEach((q, i) => {
      fuente(9); const ls = doc.splitTextToSize(q, CW - 46), h = Math.max(6.6, ls.length * 4 + 2.8);
      if (y + h > H - 18) { doc.addPage(); y = 16; cabTabla(); }
      if (i % 2) { doc.setFillColor(245, 247, 251); doc.rect(M, y, CW, h, "F"); }
      fuente(9, "normal", GRIS); doc.text(String(i + 1), M + 6, y + 4.6, { align: "right" });
      fuente(9); doc.text(ls, M + 9, y + 4.6);
      const v = R[i], et = v === "Sí" ? "Sí" : v === "No" ? "No" : v === "N/A" ? "No aplica" : "Sin respuesta";
      fuente(9, v === "Sí" || v === "No" ? "bold" : "normal", v === "Sí" ? OK : v === "No" ? MAL : GRIS); doc.text(et, W - M - 16, y + h / 2 + 1.5, { align: "center" });
      y += h;
    });
    doc.setDrawColor(...LINEA); doc.line(M, y, W - M, y); y += 4;

    // Observaciones y cliente
    titulo("OBSERVACIONES DEL SUPERVISOR"); parrafo(o.obs_supervisor);
    titulo("ENTREVISTA CON EL CLIENTE");
    fuente(9.5); salto(8); doc.text(`Se realizó: ${o.entrevista || "Sin dato"}     Nombre del cliente: ${o.nombre_cliente || "Sin dato"}${o.otro ? "     Otro: " + o.otro : ""}`, M, y + 1, { maxWidth: CW }); y += 7;
    parrafo(o.obs_cliente);

    // Firmas
    titulo("FIRMAS"); salto(44);
    const fw = (CW - 8) / 3;
    [["Guardia en turno", o.guardia, o.firma_guardia], ["Cliente", o.nombre_cliente, o.firma_cliente], ["Supervisor", o.supervisor, o.firma_supervisor]].forEach(([rol, nom, img], k) => {
      const x = M + k * (fw + 4);
      doc.setDrawColor(...LINEA); doc.roundedRect(x, y, fw, 26, 1.5, 1.5, "S");
      if (img) doc.addImage(img, "PNG", x + 2, y + 1.5, fw - 4, (fw - 4) * 240 / 640); else { fuente(8, "normal", GRIS); doc.text("Sin firma", x + fw / 2, y + 14, { align: "center" }); }
      fuente(9, "bold"); doc.text(doc.splitTextToSize(nom || "Sin nombre", fw)[0], x + fw / 2, y + 31, { align: "center" });
      fuente(8, "normal", GRIS); doc.text(rol, x + fw / 2, y + 35, { align: "center" });
    });
    y += 40;

    // Evidencias fotográficas (dos por renglón)
    if (fotos.length) {
      titulo("EVIDENCIA FOTOGRÁFICA");
      const cw = (CW - 6) / 2, ch = 66;
      fotos.forEach((p, i) => {
        if (i % 2 === 0) salto(ch + 9);
        const x = M + (i % 2) * (cw + 6), k = Math.min(cw / p.d[0], ch / p.d[1]), w = p.d[0] * k, h = p.d[1] * k;
        doc.setFillColor(245, 247, 251); doc.rect(x, y, cw, ch, "F");
        doc.addImage(p.u, "JPEG", x + (cw - w) / 2, y + (ch - h) / 2, w, h);
        fuente(8, "normal", GRIS); doc.text("Evidencia " + (i + 1), x, y + ch + 4);
        if (i % 2 === 1 || i === fotos.length - 1) y += ch + 9;
      });
    }

    if (o.archivos.length) { titulo("ARCHIVOS ADJUNTOS"); o.archivos.forEach(a => { salto(6); fuente(9); doc.text("•  " + a.nombre, M + 1, y, { maxWidth: CW }); y += 5; }); }

    // Pie de página
    const n = doc.getNumberOfPages(), hoy = new Date();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i); doc.setDrawColor(...LINEA); doc.line(M, H - 12, W - M, H - 12); fuente(7.5, "normal", GRIS);
      doc.text(`S.I.S.E.R.O · Reporte de supervisión ${o.id} · Generado el ${p2(hoy.getDate())}/${p2(hoy.getMonth() + 1)}/${hoy.getFullYear()} ${hora(hoy)}`, M, H - 7.5);
      doc.text(`Página ${i} de ${n}`, W - M, H - 7.5, { align: "right" });
    }
    const limpio = (o.servicio || "supervision").normalize("NFD").replace(/[^\w]+/g, "_").replace(/^_|_$/g, "");
    doc.save(`Supervision_${limpio}_${o.fecha}.pdf`);
  } catch (e) { console.error(e); aviso("No se pudo crear el PDF", "Revisa tu internet e intenta de nuevo."); }
  finally { btn.disabled = false; btn.textContent = txt; }
}

iniciar();
</script>
<script>
